<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>音声逆再生プレイヤー</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f4f7f6;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .container {
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      max-width: 480px;
      width: 100%;
    }
    h1 {
      font-size: 1.5rem;
      text-align: center;
      margin-top: 0;
      margin-bottom: 24px;
      color: #2c3e50;
    }
    .section {
      margin-bottom: 20px;
      padding: 15px;
      border: 1px solid #e0e6ed;
      border-radius: 8px;
      background-color: #fafbfc;
    }
    .section-title {
      font-weight: bold;
      margin-bottom: 10px;
      display: block;
      font-size: 0.95rem;
    }
    .btn-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    button {
      flex: 1;
      padding: 12px 16px;
      font-size: 0.95rem;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s, opacity 0.2s;
      color: #fff;
    }
    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .btn-rec { background-color: #e74c3c; }
    .btn-rec:hover:not(:disabled) { background-color: #c0392b; }
    .btn-stop { background-color: #7f8c8d; }
    .btn-stop:hover:not(:disabled) { background-color: #636e72; }
    .btn-play { background-color: #3498db; }
    .btn-play:hover:not(:disabled) { background-color: #2980b9; }
    .btn-rev { background-color: #9b59b6; }
    .btn-rev:hover:not(:disabled) { background-color: #8e44ad; }
    .btn-dl { background-color: #2ecc71; margin-top: 10px; width: 100%; }
    .btn-dl:hover:not(:disabled) { background-color: #27ae60; }

    input[type="file"] {
      width: 100%;
      font-size: 0.9rem;
    }
    .status {
      text-align: center;
      font-size: 0.9rem;
      color: #555;
      margin-bottom: 20px;
      min-height: 1.4em;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🔄 音声逆再生ツール</h1>
  <div id="status" class="status">録音するか音声ファイルを選択してください</div>

  <!-- 1. 録音セクション -->
  <div class="section">
    <span class="section-title">① マイクで録音する</span>
    <div class="btn-group">
      <button id="recBtn" class="btn-rec">● 録音開始</button>
      <button id="stopRecBtn" class="btn-stop" disabled>■ 録音停止</button>
    </div>
  </div>

  <!-- 2. アップロードセクション -->
  <div class="section">
    <span class="section-title">② 音声ファイルをアップロード</span>
    <input type="file" id="fileInput" accept="audio/*">
  </div>

  <!-- 3. 再生・保存セクション -->
  <div class="section">
    <span class="section-title">③ 再生・ダウンロード</span>
    <div class="btn-group">
      <button id="playNormalBtn" class="btn-play" disabled>▶ 通常再生</button>
      <button id="playRevBtn" class="btn-rev" disabled>◀ 逆再生</button>
      <button id="stopPlayBtn" class="btn-stop" disabled>■ 停止</button>
    </div>
    <button id="downloadBtn" class="btn-dl" disabled>⬇ 逆再生音声をWAVで保存</button>
  </div>
</div>

<script>
  let audioCtx = null;
  let originalBuffer = null;
  let reversedBuffer = null;
  let currentSource = null;

  let mediaRecorder = null;
  let audioChunks = [];

  const statusEl = document.getElementById('status');
  const recBtn = document.getElementById('recBtn');
  const stopRecBtn = document.getElementById('stopRecBtn');
  const fileInput = document.getElementById('fileInput');
  const playNormalBtn = document.getElementById('playNormalBtn');
  const playRevBtn = document.getElementById('playRevBtn');
  const stopPlayBtn = document.getElementById('stopPlayBtn');
  const downloadBtn = document.getElementById('downloadBtn');

  // AudioContextの初期化
  function initAudioContext() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  // 音声データのデコードと逆再生バッファの作成
  async function processAudioArrayBuffer(arrayBuffer) {
    try {
      initAudioContext();
      statusEl.textContent = "音声を処理中...";
      originalBuffer = await audioCtx.decodeAudioData(arrayBuffer);

      // 逆再生用の新しいAudioBufferを作成
      reversedBuffer = audioCtx.createBuffer(
        originalBuffer.numberOfChannels,
        originalBuffer.length,
        originalBuffer.sampleRate
      );

      // 全チャンネルの波形データを反転コピー
      for (let ch = 0; ch < originalBuffer.numberOfChannels; ch++) {
        const origData = originalBuffer.getChannelData(ch);
        const revData = reversedBuffer.getChannelData(ch);
        for (let i = 0; i < origData.length; i++) {
          revData[i] = origData[origData.length - 1 - i];
        }
      }

      statusEl.textContent = `準備完了！（長さ: ${originalBuffer.duration.toFixed(1)}秒）`;
      enablePlaybackButtons(true);
    } catch (err) {
      console.error(err);
      statusEl.textContent = "エラー: 音声の読み込みに失敗しました。";
    }
  }

  // ボタンの有効/無効切り替え
  function enablePlaybackButtons(enabled) {
    playNormalBtn.disabled = !enabled;
    playRevBtn.disabled = !enabled;
    downloadBtn.disabled = !enabled;
  }

  // 再生停止処理
  function stopPlayback() {
    if (currentSource) {
      try {
        currentSource.stop();
      } catch (e) {}
      currentSource = null;
    }
    stopPlayBtn.disabled = true;
  }

  // バッファの再生
  function playBuffer(buffer, label) {
    if (!buffer) return;
    stopPlayback();
    initAudioContext();

    currentSource = audioCtx.createBufferSource();
    currentSource.buffer = buffer;
    currentSource.connect(audioCtx.destination);
    currentSource.onended = () => {
      stopPlayBtn.disabled = true;
      statusEl.textContent = "再生終了";
    };

    currentSource.start(0);
    stopPlayBtn.disabled = false;
    statusEl.textContent = `${label}中...`;
  }

  // --- イベントリスナー ---

  // 録音開始
  recBtn.addEventListener('click', async () => {
    try {
      stopPlayback();
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];

      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) audioChunks.push(e.data);
      };

      mediaRecorder.onstop = async () => {
        // マイクの使用を停止
        stream.getTracks().forEach(track => track.stop());
        const blob = new Blob(audioChunks, { type: mediaRecorder.mimeType });
        const arrayBuffer = await blob.arrayBuffer();
        await processAudioArrayBuffer(arrayBuffer);
      };

      mediaRecorder.start();
      recBtn.disabled = true;
      stopRecBtn.disabled = false;
      enablePlaybackButtons(false);
      statusEl.textContent = "🔴 録音中... マイクに向かって話してください";
    } catch (err) {
      console.error(err);
      statusEl.textContent = "エラー: マイクへのアクセスが許可されていません。";
    }
  });

  // 録音停止
  stopRecBtn.addEventListener('click', () => {
    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
      mediaRecorder.stop();
      recBtn.disabled = false;
      stopRecBtn.disabled = true;
    }
  });

  // ファイルアップロード
  fileInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    stopPlayback();
    const arrayBuffer = await file.arrayBuffer();
    await processAudioArrayBuffer(arrayBuffer);
  });

  // 通常再生・逆再生・停止
  playNormalBtn.addEventListener('click', () => playBuffer(originalBuffer, "通常再生"));
  playRevBtn.addEventListener('click', () => playBuffer(reversedBuffer, "逆再生"));
  stopPlayBtn.addEventListener('click', () => {
    stopPlayback();
    statusEl.textContent = "停止しました";
  });

  // 逆再生音声のWAVダウンロード
  downloadBtn.addEventListener('click', () => {
    if (!reversedBuffer) return;
    const wavBlob = audioBufferToWav(reversedBuffer);
    const url = URL.createObjectURL(wavBlob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'reversed_audio.wav';
    a.click();
    URL.revokeObjectURL(url);
  });

  // AudioBufferをWAV形式(Blob)に変換する関数
  function audioBufferToWav(buffer) {
    const numChannels = buffer.numberOfChannels;
    const sampleRate = buffer.sampleRate;
    const format = 1; // PCM
    const bitDepth = 16;

    const result = new Float32Array(buffer.length * numChannels);
    for (let ch = 0; ch < numChannels; ch++) {
      const channelData = buffer.getChannelData(ch);
      for (let i = 0; i < buffer.length; i++) {
        result[i * numChannels + ch] = channelData[i];
      }
    }

    const dataLength = result.length * (bitDepth / 8);
    const headerLength = 44;
    const wavBuffer = new ArrayBuffer(headerLength + dataLength);
    const view = new DataView(wavBuffer);

    const writeString = (offset, string) => {
      for (let i = 0; i < string.length; i++) {
        view.setUint8(offset + i, string.charCodeAt(i));
      }
    };

    writeString(0, 'RIFF');
    view.setUint32(4, 36 + dataLength, true);
    writeString(8, 'WAVE');
    writeString(12, 'fmt ');
    view.setUint32(16, 16, true);
    view.setUint16(20, format, true);
    view.setUint16(22, numChannels, true);
    view.setUint32(24, sampleRate, true);
    view.setUint32(28, sampleRate * numChannels * (bitDepth / 8), true);
    view.setUint16(32, numChannels * (bitDepth / 8), true);
    view.setUint16(34, bitDepth, true);
    writeString(36, 'data');
    view.setUint32(40, dataLength, true);

    let offset = 44;
    for (let i = 0; i < result.length; i++, offset += 2) {
      const s = Math.max(-1, Math.min(1, result[i]));
      view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
    }

    return new Blob([wavBuffer], { type: 'audio/wav' });
  }
</script>

</body>
</html>
